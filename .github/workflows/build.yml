name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: TEMP - inspect ResXmlDocument / AndroidManifestBlock.load / ApkModule APIs
        run: |
          JAR=$(find ~/.gradle -iname "ARSCLib-1.4.0.jar" 2>/dev/null | head -1)
          echo "Using jar: $JAR"
          echo "===== ResXmlDocument ====="
          javap -classpath "$JAR" com.reandroid.arsc.chunk.xml.ResXmlDocument
          echo "===== ApkModule ====="
          javap -classpath "$JAR" com.reandroid.apk.ApkModule

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
